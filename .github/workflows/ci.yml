name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run of the same branch irrelevant, and these jobs hold a
  # database container each.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: the schema creates a vector column for case embeddings, so
        # a stock image fails at migration time rather than at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crucible
          POSTGRES_PASSWORD: crucible
          POSTGRES_DB: crucible
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U crucible"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://crucible:crucible@localhost:5434/crucible
      REDIS_URL: redis://localhost:6380/0
      JWT_SECRET: ci-secret-not-used-anywhere-else-32-chars
      # No provider keys: every test and the benchmark run against the built-in mock provider, so
      # CI is deterministic, offline and free. A test that needed a real key would be a test that
      # fails on a fork's pull request.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          .venv/bin/ruff check src tests benchmarks
          .venv/bin/ruff format --check src tests benchmarks

      - name: Type check
        working-directory: backend
        run: .venv/bin/mypy src benchmarks

      - name: Migrate
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -q --junitxml=results.xml

      - name: Assert the integration tests actually ran
        working-directory: backend
        # They skip themselves when Postgres is unreachable, which is right on a laptop and wrong
        # here: without this, a broken service container would look like a green build.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          suite = ET.parse("results.xml").getroot()[0]
          skipped, tests = int(suite.get("skipped", 0)), int(suite.get("tests", 0))
          assert tests > 0, "no tests ran"
          assert skipped == 0, f"{skipped} of {tests} tests skipped; the database service is not being used"
          print(f"{tests} tests, none skipped")
          PY

      - name: Benchmark (mock provider, no network)
        working-directory: backend
        run: .venv/bin/python benchmarks/run_benchmark.py --check ../docs/BENCHMARK.md

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: docs/BENCHMARK.md
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint and type check
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  self-eval:
    name: Eval — Crucible evaluating its own demo agent
    runs-on: ubuntu-latest
    needs: backend
    # Deliberately self-contained: this job boots Crucible, seeds a project, and evaluates the
    # example agent through the same CLI and the same composite action an outside team would use.
    # No deployed instance, no secrets — so it runs identically on a fork's pull request, which is
    # the only way a "we eval on every PR" claim is worth anything.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crucible
          POSTGRES_PASSWORD: crucible
          POSTGRES_DB: crucible
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U crucible"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://crucible:crucible@localhost:5434/crucible
      REDIS_URL: redis://localhost:6380/0
      JWT_SECRET: ci-secret-not-used-anywhere-else-32-chars

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the backend
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Migrate
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Start the API and a worker
        working-directory: backend
        run: |
          nohup .venv/bin/python -m crucible.cli.main serve --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup .venv/bin/python -m crucible.cli.main worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          # Poll rather than sleep: a fixed sleep is either slower than it needs to be or too short
          # on a bad day, and both failure modes look like a flaky eval.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then echo "api up"; exit 0; fi
            sleep 1
          done
          echo "API never became healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Seed a project and mint an API key
        id: seed
        working-directory: backend
        run: |
          # The key is written to the step output, not echoed: it is short-lived and scoped to a
          # throwaway database, but a key in a public build log is a habit worth not forming.
          key=$(.venv/bin/python -m crucible.cli.main seed --slug support-agent \
                | grep -o 'crk_[A-Za-z0-9_-]*' | head -1)
          test -n "$key" || { echo "seed produced no key"; exit 1; }
          echo "::add-mask::$key"
          echo "api-key=$key" >> "$GITHUB_OUTPUT"

      - name: Evaluate the example agent
        uses: ./.github/actions/crucible-eval
        with:
          api-url: http://127.0.0.1:8000
          api-key: ${{ steps.seed.outputs.api-key }}
          config: examples/support-agent/crucible.yaml
          suite: default
          # The mock provider, so the whole pipeline runs offline and free. The real target in that
          # config points at claude-sonnet-5 and is what you would run with a key.
          target: support-react-offline
          fail-on-regression: true
          version: ./backend

      - name: Evaluate the refusal suite
        uses: ./.github/actions/crucible-eval
        with:
          api-url: http://127.0.0.1:8000
          api-key: ${{ steps.seed.outputs.api-key }}
          config: examples/support-agent/crucible.yaml
          suite: refusals
          target: support-react-offline
          # Nothing to push the second time; the registry is already up to date.
          push: 'false'
          fail-on-regression: true
          version: ./backend

      - name: Server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log"
