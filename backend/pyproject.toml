[project]
name = "crucible"
version = "1.0.0"
description = "CI for AI agents — versioned prompts, golden-dataset evals, regression detection, trace and cost observability."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",  # sync driver, for Alembic only
  "alembic>=1.14",
  "pydantic[email]>=2.10",
  "pydantic-settings>=2.7",
  "redis>=5.2",
  "structlog>=24.4",
  "httpx>=0.28",
  "anthropic>=0.69",
  "openai>=1.60",
  "jsonschema>=4.23",
  "jsonpath-ng>=1.7",
  "numpy>=2.1",
  "pgvector>=0.3",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "typer>=0.15",
  "rich>=13.9",
  "pyyaml>=6.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pyyaml",
  "types-jsonschema",
  "pytest-timeout>=2.3",
  "anyio>=4.7",
]

[project.scripts]
crucible = "crucible.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "alembic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/crucible"]
omit = ["*/alembic/*", "*/cli/*"]
